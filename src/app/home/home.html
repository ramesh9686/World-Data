<div class="pure-3d-model-container">
  <!-- Minimalist Sci-Fi Telemetry Overlay (Top-Left Floating Glass HUD) -->
  <header class="home-top-hud minimal-hud-panel" reactBitsSpotlight>
    <div class="hud-brand-group">
      <span class="hud-planet-icon">🌐</span>
      <div class="hud-text-stack">
        <h1 class="hud-title">
          <react-bits-decrypted-text [text]="'WORLD EXPLORER 3D'" [speed]="30"></react-bits-decrypted-text>
        </h1>
        <div class="hud-sub-row">
          <span class="minimal-pill emerald">⚡ <react-bits-count-up [to]="60" [suffix]="' FPS'"></react-bits-count-up> FAST CORE</span>
          <span class="hud-time-tag">⏰ {{ detectedTimeString }}</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Bottom Floating Launch Pill (Positioned cleanly above the curved bottom dock) -->
  <div class="globe-click-overlay">
    <button class="globe-launch-hint-badge magnet-interactive" (click)="enterWorldData()" title="Click to launch World Data 3D Explorer">
      <span class="pulse-dot"></span>
      <span class="hint-icon">🚀</span>
      <span class="hint-text">
        <react-bits-decrypted-text [text]="'LAUNCH WORLD DATA GIS SUITE'" [speed]="25"></react-bits-decrypted-text>
      </span>
      <span class="hint-arrow">➔</span>
    </button>
  </div>

  <!-- Single Frozen Optimized 60FPS 3D Earth Globe (Instant Load) -->
  <iframe
    title="3D Earth Globe Model"
    [src]="fastEarthModelUrl"
    frameborder="0"
    allowfullscreen
    mozallowfullscreen="true"
    webkitallowfullscreen="true"
    allow="autoplay; fullscreen; xr-spatial-tracking; execution-while-out-of-viewport; execution-while-not-rendered"
    class="pure-sketchfab-iframe"
  ></iframe>
</div>
