<div class="pure-3d-model-container">
  <!-- Full-Screen Container Overlay with Launch Badge -->
  <div class="globe-click-overlay">
    <!-- Bottom Floating Launch Hint Badge -->
    <div class="globe-launch-hint-badge" (click)="enterWorldData()" title="Click to launch World Data 3D Explorer">
      <span class="pulse-dot"></span>
      <span class="hint-icon">🌐</span>
      <span class="hint-text">Drag & Rotate 3D Globe | Click Here to Open World Data Explorer</span>
      <span class="hint-arrow">➔</span>
    </div>
  </div>

  <!-- Prominent 3D Model Selector Toolbar (Top-Right High Contrast Z-Index 9999) -->
  <aside class="right-icon-dock">
    <div class="dock-header-tag">
      <span class="time-badge-text">⏰ {{ detectedTimeString }}</span>
    </div>

    <button
      class="icon-dock-btn"
      [class.active]="activeModelId === 'model1'"
      (click)="selectModel('model1'); $event.stopPropagation()"
      title="Switch to 3D Model 1: Day Earth"
    >
      <span class="btn-icon">☀️</span>
      <span class="btn-label">Day Earth</span>
    </button>

    <button
      class="icon-dock-btn"
      [class.active]="activeModelId === 'model2'"
      (click)="selectModel('model2'); $event.stopPropagation()"
      title="Switch to 3D Model 2: Night Earth"
    >
      <span class="btn-icon">🌙</span>
      <span class="btn-label">Night Earth</span>
    </button>

    <button
      class="icon-dock-btn"
      [class.active]="activeModelId === 'model3'"
      (click)="selectModel('model3'); $event.stopPropagation()"
      title="Switch to 3D Model 3: Planet Globe"
    >
      <span class="btn-icon">🪐</span>
      <span class="btn-label">Planet Globe</span>
    </button>
  </aside>

  <!-- 3D Earth Model 1 Iframe (Day Mode Photorealistic) -->
  <iframe
    [style.display]="activeModelId === 'model1' ? 'block' : 'none'"
    title="3D Earth Model 1"
    [src]="model1Url"
    frameborder="0"
    allowfullscreen
    mozallowfullscreen="true"
    webkitallowfullscreen="true"
    allow="autoplay; fullscreen; xr-spatial-tracking"
    class="pure-sketchfab-iframe"
  ></iframe>

  <!-- 3D Earth Model 2 Iframe (Night Mode 16k High-Res) -->
  <iframe
    [style.display]="activeModelId === 'model2' ? 'block' : 'none'"
    title="3D Earth Model 2"
    [src]="model2Url"
    frameborder="0"
    allowfullscreen
    mozallowfullscreen="true"
    webkitallowfullscreen="true"
    allow="autoplay; fullscreen; xr-spatial-tracking"
    class="pure-sketchfab-iframe"
  ></iframe>

  <!-- 3D Earth Model 3 Iframe (Planet Globe) -->
  <iframe
    [style.display]="activeModelId === 'model3' ? 'block' : 'none'"
    title="3D Earth Model 3"
    [src]="model3Url"
    frameborder="0"
    allowfullscreen
    mozallowfullscreen="true"
    webkitallowfullscreen="true"
    allow="autoplay; fullscreen; xr-spatial-tracking"
    class="pure-sketchfab-iframe"
  ></iframe>
</div>
