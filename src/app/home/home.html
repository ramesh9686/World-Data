<div class="pure-3d-model-container">
  <!-- Minimalist Sci-Fi Telemetry Overlay (Top-Left Floating Glass HUD) -->
  <header class="home-top-hud minimal-hud-panel" reactBitsSpotlight>
    <div class="hud-brand-group">
      <span class="hud-planet-icon">🌐</span>
      <div class="hud-text-stack">
        <h1 class="hud-title">
          <react-bits-decrypted-text [text]="'WORLD EXPLORER 3D'" [speed]="30"></react-bits-decrypted-text>
        </h1>
        <div class="hud-sub-row">
          <span class="minimal-pill emerald">⚡ <react-bits-count-up [to]="60" [suffix]="' FPS'"></react-bits-count-up> NATIVE 3D CORE</span>
          <span class="hud-time-tag">⏰ {{ detectedTimeString }}</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Drag & Rotate Controller Hint Badge -->
  <div class="drag-hint-pill">
    <span class="drag-hint-icon">🖱️</span>
    <span class="drag-hint-text">Drag anywhere to rotate • Scroll to zoom</span>
  </div>

  <!-- Bottom Floating Launch Pill (Positioned cleanly above the curved bottom dock) -->
  <div class="globe-click-overlay">
    <button class="globe-launch-hint-badge magnet-interactive" (click)="enterWorldData()" title="Click to launch World Data 3D Explorer">
      <span class="pulse-dot"></span>
      <span class="hint-icon">🚀</span>
      <span class="hint-text">
        <react-bits-decrypted-text [text]="'LAUNCH WORLD DATA GIS SUITE'" [speed]="25"></react-bits-decrypted-text>
      </span>
      <span class="hint-arrow">➔</span>
    </button>
  </div>

  <!-- Loading State Indicator -->
  @if (isLoading) {
    <div class="model-loading-overlay">
      <div class="loading-ring"></div>
      <div class="loading-title">INITIALIZING 3D PLANET</div>
      <div class="loading-bar-track">
        <div class="loading-bar-fill" [style.width.%]="loadProgress || 65"></div>
      </div>
      <span class="loading-subtitle">PREPARING 3D MESH & TEXTURES</span>
    </div>
  }

  <!-- Error Message (if any) -->
  @if (loadError) {
    <div class="model-error-overlay">
      <span class="error-icon">⚠️</span>
      <p>{{ loadError }}</p>
    </div>
  }

  <!-- Three.js Native 3D WebGL Canvas -->
  <canvas #canvas3d class="webgl-canvas"></canvas>
</div>
